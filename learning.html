<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">

    <title>Elif Baja - Mësimi Interaktiv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        /* MOBILE FIRST - Base styles for mobile devices */
        .container {
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            white-space: nowrap;
        }

        .nav-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .pdf-viewer {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 15px;
            position: relative;
            overflow: hidden;
            order: 1;
        }

        .pdf-content {
            width: 100%;
            height: 300px;
            border: none;
            border-radius: 8px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #666;
            position: relative;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        .page-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .page-navigation {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .nav-btn-pdf {
            background: rgba(102, 126, 234, 0.9);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .nav-btn-pdf:hover {
            background: rgba(102, 126, 234, 1);
        }

        .nav-btn-pdf:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .audio-controls {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            order: 2;
        }

        .book-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .book-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .book-author {
            color: #666;
            font-size: 14px;
        }

        .current-page-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .page-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
            font-size: 14px;
        }

        .page-duration {
            font-size: 12px;
            color: #666;
        }

        .audio-player {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .progress-container {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            touch-action: manipulation;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .control-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.3);
            touch-action: manipulation;
        }

        .control-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .control-btn.play-pause {
            width: 55px;
            height: 55px;
            font-size: 20px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .speed-label {
            font-size: 12px;
            color: #666;
            margin-right: 5px;
        }

        .speed-btn {
            background: #e9ecef;
            border: none;
            padding: 6px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
            touch-action: manipulation;
            min-width: 40px;
        }

        .speed-btn:hover {
            background: #dee2e6;
        }

        .speed-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .chapter-list {
            max-height: 250px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #667eea transparent;
        }

        .chapter-list::-webkit-scrollbar {
            width: 4px;
        }

        .chapter-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .chapter-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 2px;
        }

        .chapter-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            touch-action: manipulation;
        }

        .chapter-item:hover {
            background: #f0f2ff;
            border-left-color: #667eea;
        }

        .chapter-item:active {
            transform: scale(0.98);
        }

        .chapter-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-left-color: #fff;
        }

        .chapter-title {
            font-weight: 500;
            margin-bottom: 3px;
            font-size: 13px;
            line-height: 1.4;
        }

        .chapter-duration {
            font-size: 11px;
            opacity: 0.7;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* TABLET STYLES - 768px and up */
        @media screen and (min-width: 768px) {
            .container {
                padding: 20px;
                gap: 20px;
            }

            .header {
                padding: 20px;
                margin-bottom: 15px;
            }

            .logo {
                font-size: 24px;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .pdf-content {
                height: 400px;
            }

            .book-title {
                font-size: 20px;
            }

            .book-author {
                font-size: 15px;
            }

            .page-title {
                font-size: 15px;
            }

            .chapter-list {
                max-height: 300px;
            }

            .chapter-title {
                font-size: 14px;
            }

            .speed-control {
                justify-content: flex-start;
            }

            .player-controls {
                gap: 25px;
            }

            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }

            .control-btn.play-pause {
                width: 60px;
                height: 60px;
                font-size: 22px;
            }
        }

        /* DESKTOP STYLES - 1024px and up */
        @media screen and (min-width: 1024px) {
            .container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 30px;
                display: grid;
                grid-template-columns: 1fr 420px;
                grid-template-rows: auto 1fr;
                gap: 30px;
                min-height: 100vh;
            }

            .header {
                grid-column: 1 / -1;
                margin-bottom: 0;
            }

            .pdf-viewer {
                order: unset;
                grid-column: 1;
                grid-row: 2;
            }

            .pdf-content {
                height: 70vh;
            }

            .audio-controls {
                order: unset;
                grid-column: 2;
                grid-row: 2;
                height: fit-content;
                position: sticky;
                top: 30px;
            }

            .book-title {
                font-size: 22px;
            }

            .chapter-list {
                max-height: 350px;
            }

            .page-navigation {
                bottom: 20px;
                gap: 10px;
            }

            .nav-btn-pdf {
                padding: 10px 15px;
                font-size: 14px;
            }

            .page-indicator {
                top: 20px;
                right: 20px;
                padding: 8px 16px;
                font-size: 14px;
            }
        }

        /* LARGE DESKTOP - 1440px and up */
        @media screen and (min-width: 1440px) {
            .container {
                grid-template-columns: 1fr 450px;
            }

            .pdf-content {
                height: 75vh;
            }
        }

        /* HIGH DPI DISPLAYS */
        @media screen and (-webkit-min-device-pixel-ratio: 2),
        screen and (min-resolution: 192dpi) {

            .control-btn,
            .nav-btn,
            .speed-btn {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
        }

        /* LANDSCAPE ORIENTATION ON MOBILE */
        @media screen and (max-width: 767px) and (orientation: landscape) {
            .pdf-content {
                height: 250px;
            }

            .chapter-list {
                max-height: 180px;
            }
        }

        /* REDUCED MOTION */
        @media (prefers-reduced-motion: reduce) {

            .control-btn,
            .nav-btn,
            .speed-btn,
            .chapter-item {
                transition: none;
            }

            .spinner {
                animation: none;
            }
        }

        /* DARK MODE SUPPORT */
        @media (prefers-color-scheme: dark) {
            .pdf-content {
                background: #2d3748;
                color: #e2e8f0;
            }

            .loading p {
                color: #e2e8f0;
            }
        }

        /* PRINT STYLES */
        @media print {
            .container {
                background: none;
            }

            .audio-controls,
            .page-navigation {
                display: none;
            }
        }
    </style>
</head>

                this.chapterList = document.getElementById('chapterList');
                this.pdfContent = document.getElementById('pdfContent');
                this.currentPageEl = document.getElementById('currentPage');
                this.totalPagesEl = document.getElementById('totalPages');
                this.currentPageTitleEl = document.getElementById('currentPageTitle');
                this.currentPageDurationEl = document.getElementById('currentPageDuration');

                this.setupEventListeners();
            }

            setupEventListeners() {
                // Audio player events
                this.audioPlayer.addEventListener('loadedmetadata', () => this.updateDuration());
                this.audioPlayer.addEventListener('timeupdate', () => this.updateProgress());
                this.audioPlayer.addEventListener('ended', () => this.nextPage());
                this.audioPlayer.addEventListener('canplay', () => this.handleAudioReady());
                this.audioPlayer.addEventListener('play', () => {
                    this.isPlaying = true;
                    this.playPauseBtn.textContent = '⏸';
                });
                this.audioPlayer.addEventListener('pause', () => {
                    this.isPlaying = false;
                    this.playPauseBtn.textContent = '▶';
                });

                // Control buttons
                this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
                this.prevBtn.addEventListener('click', () => this.previousPage());
                this.nextBtn.addEventListener('click', () => this.nextPage());
                this.prevPageBtn.addEventListener('click', () => this.previousPage());
                this.nextPageBtn.addEventListener('click', () => this.nextPage());

                // Progress bar
                this.progressBar.addEventListener('click', (e) => this.seekTo(e));
                this.progressBar.addEventListener('touchend', (e) => this.seekTo(e.changedTouches[0]));

                // Speed controls
                document.querySelectorAll('.speed-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.changeSpeed(e.target.dataset.speed));
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => this.handleKeyboard(e));
            }

            handleKeyboard(e) {
                if (e.target.tagName.toLowerCase() === 'input') return;

                switch (e.code) {
                    case 'Space':
                        e.preventDefault();
                        this.togglePlayPause();
                        break;
                    case 'ArrowLeft':
                        this.previousPage();
                        break;
                    case 'ArrowRight':
                        this.nextPage();
                        break;
                }
            }

            async loadAudiobook() {
                try {
                    // Set book info
                    document.getElementById('bookTitle').textContent = AUDIOBOOK_CONFIG.title;
                    document.getElementById('bookAuthor').textContent = AUDIOBOOK_CONFIG.author;

                    // Set total pages
                    this.totalPages = AUDIOBOOK_CONFIG.chapters.length;
                    this.totalPagesEl.textContent = this.totalPages;

                    // Load PDF
                    await this.loadPDF();

                    // Create chapter list
                    this.createChapterList();

                    // Load first page
                    this.loadPage(0);

                    this.isLoading = false;
                } catch (error) {
                    console.error('Error loading audiobook:', error);
                    this.showError('Gabim në ngarkimin e librit. Kontrolloni skedarët.');
                }
            }

            async loadPDF() {
                return new Promise((resolve, reject) => {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'pdf-frame';
                    iframe.src = AUDIOBOOK_CONFIG.pdfFile;
                    iframe.onload = () => resolve();
                    iframe.onerror = () => reject(new Error('Failed to load PDF'));

                    this.pdfContent.innerHTML = '';
                    this.pdfContent.appendChild(iframe);
                });
            }

            createChapterList() {
                this.chapterList.innerHTML = '';

                AUDIOBOOK_CONFIG.chapters.forEach((chapter, index) => {
                    const pageNumber = index + 1;
                    const pageTitle = chapter.title || `Faqja ${pageNumber}`;

                    const item = document.createElement('div');
                    item.className = `chapter-item ${index === 0 ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="chapter-title">${pageTitle}</div>
                        <div class="chapter-duration">Duke ngarkuar...</div>
                    `;
                    item.addEventListener('click', () => this.loadPage(index));
                    this.chapterList.appendChild(item);
                });
            }

            loadPage(pageIndex) {
                if (pageIndex < 0 || pageIndex >= this.totalPages) return;

                const wasPlaying = this.isPlaying;
                if (wasPlaying) {
                    this.audioPlayer.pause();
                }

                this.currentPageIndex = pageIndex;
                const pageNumber = pageIndex + 1;
                const audioFile = AUDIOBOOK_CONFIG.chapters[pageIndex].audio;
                const pageTitle = AUDIOBOOK_CONFIG.chapters[pageIndex].title || `Faqja ${pageNumber}`;

                // Update audio source
                this.audioPlayer.src = audioFile;

                // Update UI
                this.currentPageEl.textContent = pageNumber;
                this.currentPageTitleEl.textContent = pageTitle;

                // Update chapter list
                document.querySelectorAll('.chapter-item').forEach((item, i) => {
                    item.classList.toggle('active', i === pageIndex);
                });

                // Update navigation buttons
                this.prevBtn.disabled = pageIndex === 0;
                this.nextBtn.disabled = pageIndex === this.totalPages - 1;
                this.prevPageBtn.disabled = pageIndex === 0;
                this.nextPageBtn.disabled = pageIndex === this.totalPages - 1;

                // Update PDF page
                this.updatePDFPage(pageNumber);

                // Auto-scroll to current chapter on mobile
                if (window.innerWidth <= 767) {
                    const activeChapter = document.querySelector('.chapter-item.active');
                    if (activeChapter) {
                        activeChapter.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }

                // Resume playing if it was playing before
                if (wasPlaying && !this.isLoading) {
                    setTimeout(() => {
                        this.audioPlayer.play().catch(console.error);
                    }, 100);
                }
            }

            updatePDFPage(pageNumber) {
                const iframe = this.pdfContent.querySelector('iframe');
                if (iframe) {
                    // Calculate approximate page based on chapter index
                    // This is a rough estimation since we don't have exact page mappings
                    const estimatedPage = Math.max(1, pageNumber + 5); // Offset for intro pages
                    iframe.src = `${AUDIOBOOK_CONFIG.pdfFile}#page=${estimatedPage}`;
                }
            }

            handleAudioReady() {
                // Update duration in chapter list
                const currentItem = this.chapterList.children[this.currentPageIndex];
                if (currentItem) {
                    const durationEl = currentItem.querySelector('.chapter-duration');
                    durationEl.textContent = this.formatTime(this.audioPlayer.duration);
                }

                this.currentPageDurationEl.textContent = this.formatTime(this.audioPlayer.duration);
            }

            togglePlayPause() {
                if (this.isLoading) return;

                if (this.isPlaying) {
                    this.audioPlayer.pause();
                } else {
                    this.audioPlayer.play().catch(console.error);
                }
            }

            previousPage() {
                this.loadPage(this.currentPageIndex - 1);
            }

            nextPage() {
                this.loadPage(this.currentPageIndex + 1);
            }

            updateProgress() {
                if (this.audioPlayer.duration) {
                    const progress = (this.audioPlayer.currentTime / this.audioPlayer.duration) * 100;
                    this.progressFill.style.width = `${progress}%`;
                    this.currentTimeEl.textContent = this.formatTime(this.audioPlayer.currentTime);
                }
            }

            updateDuration() {
                this.totalTimeEl.textContent = this.formatTime(this.audioPlayer.duration || 0);
            }

            seekTo(event) {
                if (!this.audioPlayer.duration) return;

                const rect = this.progressBar.getBoundingClientRect();
                const clientX = event.clientX || event.pageX;
                const progress = (clientX - rect.left) / rect.width;
                this.audioPlayer.currentTime = Math.max(0, Math.min(progress * this.audioPlayer.duration, this.audioPlayer.duration));
            }

            changeSpeed(speed) {
                this.audioPlayer.playbackRate = parseFloat(speed);
                document.querySelectorAll('.speed-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.speed === speed);
                });
            }

            formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            showError(message) {
                this.pdfContent.innerHTML = `
                    <div style="text-align: center; color: #dc3545; padding: 20px;">
                        <h3>⚠️ Gabim</h3>
                        <p style="margin: 10px 0;">${message}</p>
                        <button onclick="location.reload()" style="background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                            Provo Përsëri
                        </button>
                    </div>
                `;
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new AudiobookPlayer();
        });

        // Service worker for offline support (optional)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {
                    // Service worker registration failed, continue without offline support
                });
            });
        }
    </script>
</body>
